name: Email Notifier

# Do not enable ACTIONS_RUNNER_DEBUG or ACTIONS_STEP_DEBUG in public repos.
# Debug logs may include additional execution details.

on:
  repository_dispatch:
    types: [notify]

permissions:
  contents: read

concurrency:
  group: email-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send notification
        env:
          PAYLOAD_ENCRYPTION_KEY: ${{ secrets.PAYLOAD_ENCRYPTION_KEY }}
          MAIL_PROVIDER: ${{ secrets.MAIL_PROVIDER }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          MAIL_API_ENDPOINT: ${{ secrets.MAIL_API_ENDPOINT }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python notify.py
